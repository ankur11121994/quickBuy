spring.application.name=quickBuy
server.port=8082

# ==========================================
# ORACLE DATABASE CONNECTION CONFIGURATIONS
# ==========================================

# 1. Database Connection URL
# Format: jdbc:oracle:thin:@//[HOST]:[PORT]/[SERVICE_NAME] or [SID]
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XE

# 2. Database Driver Class Name
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# 3. Database Credentials
spring.datasource.username=ecommerceappuser
spring.datasource.password=ecommerceapp

# ==========================================
# JPA / HIBERNATE CONFIGURATIONS
# ==========================================

# Use the dedicated Oracle Dialect (Oracle 12c, 19c, 21c+)
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Hibernate DDL strategy: use 'none' or 'validate' if you already created tables manually via SQL Developer
spring.jpa.hibernate.ddl-auto=validate

# Set to true to view generated SQL in the console (great for debugging Paging/Sorting queries)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.cors=DEBUG